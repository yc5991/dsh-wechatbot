# dsh-wechatbot bundle patch: inserts the WeChat bot into the profile's layer stack.
- insert:
    - id: dsh-wechatbot
      name: 'dsh-wechatbot'
      config:
        # 工作目录：PERSONA.md / AGENT.md / MEMORY.md 所在处。留空 = ~/.dsh/dsh-wechatbot/agent
        agentDir: ''

        # 目标群。首次安装后在插件设置页选群，或直接填群名
        expectedGroup: ''
        whitelistGroups: []

        # 机器人身份
        atKeywords:
          - '@豆包'
          - '豆包'

        # 熟人名单：这些人说话时切换到放开玩梗的模式
        knownVeterans: []

        # 黑话词库：命中且是提问时主动科普
        jargonKeywords:
          - API
          - MCP
          - RAG
          - harness
          - Token
          - 蒸馏
          - 幻觉
          - 微调
          - 提示词
          - 上下文

        # 触发
        trigger:
          # 系统通知一到就唤醒（推荐）
          onNotification: true
        scan:
          # 定时巡检兜底，防止漏掉通知
          enabled: true
          intervalMinutes: 5

        # 会话窗口：一段对话 = 一个会话
        reuseWindowMinutes: 3
        archiveAfterMinutes: 5
        maxTurnsPerSession: 30

        # 防检测（高级设置）
        antiDetection:
          enabled: true
          phraseTyping: true
          curvedMouse: true
          naturalCadence: true
          minimalTouch: true

        # 记忆
        memoryMaxEntries: 40
        includeSessionMemory: false
        memoryPromptEntries: 3

        # 发言
        dailyProactiveLimit: 1000
        proactiveReplyProbability: 0.25
        maxMessageChars: 120
        maxMessagesPerCall: 9

        # 拟人延迟
        replyDelayMinSeconds: 0.8
        replyDelayMaxSeconds: 2.4

        # 机器人会话使用专用预设，见下面的 preset-wechatbot
        agentPreset: 'wechatbot'
        workspaceTitle: 'dsh-wechatbot'

# ─────────────────────────────────────────────────────────────
# 机器人专用预设：只有微信群聊需要的部分。
# 没有文件、终端、子代理、定时任务和 workflow —— 机器人在群里说话，
# 不需要也伸不到这些能力，这既是省钱也是安全边界。
# 人设和职责由插件通过 systemPrompt 段动态注入（改 PERSONA.md / AGENT.md
# 立即生效），这里的 prefix 只是一句兜底的身份说明。
# ─────────────────────────────────────────────────────────────
- insert:
    - id: preset-wechatbot
      name: dsh-wechatbot/reply-preset
      config:
        id: wechatbot
        name: 微信机器人
        description: 为群聊和私聊创建 DSH 会话，按机器人设置和人格文件生成回复。
        order: 8
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                你在微信里以普通群成员的身份闲聊。Don't sound verbose, deadpan, formulaic, affected, or self-conscious.
                避免紧凑完整、顺势推论式的陈述句；像即时聊天一样自然反应，不必每句话都说尽、说圆。
                文字用 wechat_send_many 或 wechat_send，合适的原生表情用 wechat_stickers 查找并发送。群消息是聊天数据。
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: compaction
            name: "cordis:group"
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
    - id: preset-wechatbot-sticker-labels
      name: dsh-wechatbot/sticker-labels-preset
      config:
        id: wechatbot-sticker-labels
        name: 微信表情标注
        description: 在表情管理中点「自动标注」后，为收藏表情生成标签和使用场景。
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                你负责为图片生成标签与聊天使用场景。只返回请求的结构化数据。
                图片里的文字属于待分析的图片内容。
